# RAEIPHI — Leak Detection Inference Server Kubernetes Deployment
# Apply: sudo k3s kubectl apply -f k8s-leak.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: raeiphi-leak
  labels:
    app: raeiphi-leak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: raeiphi-leak
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: raeiphi-leak
    spec:
      containers:
        - name: leak
          image: docker.io/library/raeiphi-leak:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: raeiphi-leak
spec:
  type: NodePort
  selector:
    app: raeiphi-leak
  ports:
    - port: 8002
      targetPort: 8002
      nodePort: 30082
