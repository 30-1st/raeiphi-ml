# RAEIPHI — Occupancy Inference Server Kubernetes Deployment
# Apply: sudo k3s kubectl apply -f k8s-occupancy.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: raeiphi-occupancy
  labels:
    app: raeiphi-occupancy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: raeiphi-occupancy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: raeiphi-occupancy
    spec:
      containers:
        - name: occupancy
          image: docker.io/library/raeiphi-occupancy:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: raeiphi-occupancy
spec:
  type: NodePort
  selector:
    app: raeiphi-occupancy
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
